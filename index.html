<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海贼王人格测试</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Microsoft Yahei","PingFang SC",sans-serif;
  color:#fff;
}
body{
  min-height:100vh;
  background:#000;
  background-image:url("background.jpeg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}
/* 外层遮罩 */
.mask{
  min-height:100vh;
  background:rgba(0,0,0,0.45);
  padding:24px 12px 40px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
/* 内容卡片：400px小游戏内嵌感 + 金色外发光 */
.page{
  display:none;
  width:100%;
  max-width:400px;
  background:rgba(15,15,15,0.82);
  border:1px solid rgba(212,175,55,0.45);
  border-radius:20px;
  padding:22px 18px 20px;
  box-shadow:
    0 0 18px rgba(212,175,55,0.25),
    0 10px 30px rgba(0,0,0,0.45);
  transition:transform 0.25s ease, box-shadow 0.25s ease;
}
.page.active{
  display:block;
  animation:cardIn 0.35s ease both;
}
@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(0.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
/* 首页 */
#page-home{
  text-align:center;
  padding-top:28px;
  padding-bottom:28px;
}
#page-home h1{
  font-size:24px;
  margin-bottom:10px;
  color:#ffd700;
}
#page-home p{
  font-size:14px;
  color:#ccc;
  margin-bottom:16px;
  line-height:1.6;
}
.age-title{
  font-size:15px;
  color:#ffd700;
  margin-bottom:10px;
}
.age-opt{
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:12px 13px;
  margin-bottom:10px;
  cursor:pointer;
  background:rgba(255,255,255,0.04);
  transition:
    transform 0.22s ease,
    border-color 0.22s ease,
    background 0.22s ease;
}
.age-opt:hover{
  border-color:rgba(212,175,55,0.55);
  background:rgba(212,175,55,0.10);
}
.age-opt.selected{
  border-color:#ffd700;
  background:rgba(212,175,55,0.20);
}
#btnStart{
  margin-top:12px;
}
/* 答题页 */
#page-quiz{
  padding-top:18px;
  padding-bottom:90px;
}
.progressText{
  font-size:13px;
  color:#bbb;
  margin-bottom:12px;
  text-align:center;
}
#qText{
  font-size:17px;
  line-height:1.6;
  margin-bottom:16px;
  color:#fff3c4;
  font-weight:600;
}
/* 选项 */
.opt{
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:12px 13px;
  margin-bottom:10px;
  display:flex;
  gap:10px;
  cursor:pointer;
  background:rgba(255,255,255,0.04);
  transition:
    transform 0.22s ease,
    border-color 0.22s ease,
    background 0.22s ease,
    box-shadow 0.22s ease;
}
.opt:hover{
  border-color:rgba(212,175,55,0.55);
  background:rgba(212,175,55,0.10);
  transform:translateY(-2px) scale(1.015);
  box-shadow:0 6px 18px rgba(212,175,55,0.18);
}
.opt.selected{
  border-color:#ffd700;
  background:rgba(212,175,55,0.20);
  box-shadow:
    0 0 0 1px rgba(255,215,0,0.35),
    0 8px 20px rgba(212,175,55,0.28);
  animation:goldPulse 1.6s ease-in-out infinite alternate;
}
@keyframes goldPulse{
  from{
    box-shadow:
      0 0 0 1px rgba(255,215,0,0.35),
      0 8px 20px rgba(212,175,55,0.28);
  }
  to{
    box-shadow:
      0 0 0 1px rgba(255,215,0,0.55),
      0 10px 24px rgba(212,175,55,0.42);
  }
}
.opt-label{
  font-weight:bold;
  color:#ffd700;
  min-width:22px;
  font-size:15px;
}
.opt-text{
  flex:1;
  font-size:14px;
  line-height:1.55;
}
/* 底部操作栏：恢复上一题/下一题按钮 */
.bottom-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:12px;
  background:linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:10;
}
button{
  padding:11px 22px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(30,30,30,0.85);
  color:#fff;
  font-size:15px;
  cursor:pointer;
  transition:
    transform 0.18s ease,
    filter 0.18s ease,
    box-shadow 0.18s ease;
}
button:hover{
  transform:translateY(-1px) scale(1.02);
  filter:brightness(1.08);
  box-shadow:0 6px 16px rgba(0,0,0,0.35);
}
button:active{
  transform:translateY(0) scale(0.98);
  filter:brightness(0.95);
}
button:disabled{
  opacity:0.35;
  cursor:not-allowed;
  transform:none;
  filter:none;
  box-shadow:none;
}
#nextBtn, #btnStart, #restartBtn{
  background:linear-gradient(135deg,#ffd700,#d4af37);
  color:#2b2200;
  border:none;
  font-weight:bold;
  transition:
    transform 0.18s ease,
    filter 0.18s ease,
    box-shadow 0.18s ease;
}
#nextBtn:hover, #btnStart:hover, #restartBtn:hover{
  filter:brightness(1.12);
  box-shadow:0 8px 20px rgba(212,175,55,0.45);
}
/* 结果页 */
#page-result{
  padding-top:20px;
  padding-bottom:24px;
}
#resAvatar{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  margin:0 auto 10px;
  border:3px solid #ffd700;
  display:block;
  background:#222;
}
#charName{
  text-align:center;
  font-size:22px;
  color:#ffd700;
  font-weight:bold;
  margin-bottom:4px;
}
#charTag{
  text-align:center;
  font-size:13px;
  color:#ccc;
  margin-bottom:16px;
}
.bar-wrap{
  margin:14px 0 18px;
}
.bar-item{
  margin:9px 0;
}
.bar-label{
  font-size:13px;
  color:#eee;
  margin-bottom:4px;
}
.bar{
  width:100%;
  height:9px;
  background:rgba(255,255,255,0.08);
  border-radius:6px;
  overflow:hidden;
}
.bar>div{
  height:100%;
  background:linear-gradient(90deg,#ffd700,#d4af37);
  position:relative;
  overflow:hidden;
}
/* 进度条流光 */
.bar>div::after{
  content:"";
  position:absolute;
  top:0;
  left:-40%;
  width:40%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
  animation:shine 2.4s infinite;
}
@keyframes shine{
  0%{left:-40%}
  60%{left:100%}
  100%{left:100%}
}
.desc{
  line-height:1.7;
  font-size:14px;
}
.desc>div{
  margin-bottom:14px;
}
.desc strong{
  color:#ffd700;
  font-size:15px;
  display:block;
  margin-bottom:6px;
}
.same-tag{
  display:inline-block;
  padding:4px 10px;
  background:rgba(212,175,55,0.12);
  border:1px solid rgba(212,175,55,0.25);
  border-radius:99px;
  margin:4px 4px 0 0;
  font-size:13px;
  color:#ffe49c;
}
#restartBtn{
  margin-top:18px;
  width:100%;
}
/* 小屏适配 */
@media (max-width: 420px){
  .page{
    max-width:92%;
    padding:18px 14px 16px;
  }
  #page-quiz{
    padding-bottom:82px;
  }
  #qText{
    font-size:16px;
  }
  .opt-text{
    font-size:13.5px;
  }
}
</style>
</head>
<body>
<div class="mask">
  <!-- 首页（增加年龄段选择） -->

    <div class="desc">

      <div><strong>⭐ 人格闪光点</strong><span id="charGood"></span></div>

      <div><strong>🔍 同类型角色</strong><span id="sameBox"></span></div>

    <button id="restartBtn">重新测试</button>
  </div>

</div>

<script>

  {q:"空闲时间更喜欢？",o:["A 出去玩、探索新鲜事物","B 打磨技能、提升自己","C 和亲友待在一起","D 看书、思考、研究","E 多种方式轮换"]},

// 角色文案库：A少年 / B青年 / C成年 三套文案

  {

    avatar:"./avatar/luffy.png",
    free:26,will:18,gentle:20,wise:10,
    a:{analysis:"你超级喜欢冒险！想和好朋友一起出海，想去哪个岛就去哪，大口吃肉，保护伙伴，做最开心的海盗！",good:"勇敢、真诚，很会带动大家一起玩，愿意保护好朋友。",bad:"有时候太冲动，没有多想危险，容易莽撞。",mate:"靠谱、会思考的伙伴，帮你避开危险。"},

    c:{analysis:"路飞追求的自由，本质是拒绝被固化秩序、权力与利益绑架的自主选择权。这份自由自带边界，他不会以自由为名伤害他人，愿意为守护伙伴承担代价。你同样拥有这份底色：不被世俗规则裹挟，同时懂得自由不是无底线任性。",good:"本心纯粹，不被利益绑架，有担当，愿意为珍视的人付出代价。",bad:"容易轻视规则的约束，缺少风险预判，容易因为感性选择付出较高代价。",mate:"理性稳重的同行者，帮你在坚持本心的同时看懂现实代价。"}
  },
  {

// 其余角色统一套用青年版作为兜底，如需我可以继续补齐所有角色的A/B/C三套文案
const home = document.getElementById('page-home');
const quiz = document.getElementById('page-quiz');
const res = document.getElementById('page-result');
const qText = document.getElementById('qText');
const optBox = document.getElementById('optBox');
const curIndex = document.getElementById('curIndex');
const totalIndex = document.getElementById('totalIndex');
const btnStart = document.getElementById('btnStart');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');

const resAvatar = document.getElementById('resAvatar');
const charName = document.getElementById('charName');
const charTag = document.getElementById('charTag');
const barFree = document.getElementById('barFree');
const barWill = document.getElementById('barWill');
const barGentle = document.getElementById('barGentle');
const barWise = document.getElementById('barWise');
const charAnalysis = document.getElementById('charAnalysis');
const charGood = document.getElementById('charGood');
const charBad = document.getElementById('charBad');
const charMate = document.getElementById('charMate');
const sameBox = document.getElementById('sameBox');

let curQ = 0;
let score = {free:0,will:0,gentle:0,wise:0};
let answerRecord = Array(questionList.length).fill(null);
let selectOpt = null;
let selectedAge = null; // 存储年龄段 A/B/C

totalIndex.innerText = questionList.length;

// 年龄段选择
document.querySelectorAll('.age-opt').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.age-opt').forEach(d=>d.classList.remove('selected'));
    el.classList.add('selected');
    selectedAge = el.dataset.age;
    btnStart.disabled = false;
  })
})

btnStart.addEventListener('click',()=>{
  if(!selectedAge) return;
  home.classList.remove('active');
  quiz.classList.add('active');
  curQ = 0;
  score = {free:0,will:0,gentle:0,wise:0};
  answerRecord = Array(questionList.length).fill(null);
  selectOpt = null;
  showQuestion();
});

function showQuestion(){
  selectOpt = answerRecord[curQ];
  curIndex.innerText = curQ + 1;
  const q = questionList[curQ];
  qText.innerText = `${curQ + 1}. ${q.q}`;
  optBox.innerHTML = '';

  q.o.forEach((itemStr,i)=>{
    const optKey = ['free','will','gentle','wise','e'][i];
    const splitIndex = itemStr.indexOf(' ');
    const labelText = itemStr.substring(0, splitIndex);
    const contentText = itemStr.substring(splitIndex + 1);

    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="opt-label">${labelText}</span><span class="opt-text">${contentText}</span>`;
    if(selectOpt === optKey) div.classList.add('selected');

    div.addEventListener('click',()=>{
      document.querySelectorAll('.opt').forEach(d=>d.classList.remove('selected'));
      div.classList.add('selected');
      selectOpt = optKey;
      answerRecord[curQ] = selectOpt;
      setTimeout(()=>{
        curQ++;
        if(curQ >= questionList.length){
          calcTotalScore();
          renderResult();
        }else{
          showQuestion();
        }
      },280);
    });
    optBox.appendChild(div);
  });

  prevBtn.disabled = curQ === 0;
  nextBtn.innerText = (curQ >= questionList.length - 1) ? "查看结果" : "下一题";
}

nextBtn.addEventListener('click',()=>{
  if(!selectOpt){alert("请选择一个答案");return;}
  answerRecord[curQ] = selectOpt;
  curQ++;
  if(curQ >= questionList.length){
    calcTotalScore();
    renderResult();
  }else{
    showQuestion();
  }
});

prevBtn.addEventListener('click',()=>{
  if(curQ > 0){
    curQ--;
    selectOpt = answerRecord[curQ];
    showQuestion();
  }
});

function calcTotalScore(){
  score = {free:0,will:0,gentle:0,wise:0};
  answerRecord.forEach(ans=>{
    if(!ans) return;
    if(ans === 'free') score.free +=2;
    if(ans === 'will') score.will +=2;
    if(ans === 'gentle') score.gentle +=2;
    if(ans === 'wise') score.wise +=2;
    if(ans === 'e'){
      score.free +=1;score.will +=1;score.gentle +=1;score.wise +=1;
    }
  });
}

function renderResult(){
  quiz.classList.remove('active');
  res.classList.add('active');

  let bestChar = charList[0];
  let minDist = 9999;
  charList.forEach(ch=>{
    const dx = score.free - ch.free;
    const dy = score.will - ch.will;
    const dz = score.gentle - ch.gentle;
    const dw = score.wise - ch.wise;
    const dist = Math.sqrt(dx*dx+dy*dy+dz*dz+dw*dw);
    if(dist < minDist){
      minDist = dist;
      bestChar = ch;
    }
  });

  resAvatar.src = bestChar.avatar;
  charName.innerText = bestChar.name;
  charTag.innerText = bestChar.tag;

  barFree.style.width = `${(score.free/30)*100}%`;
  barWill.style.width = `${(score.will/30)*100}%`;
  barGentle.style.width = `${(score.gentle/30)*100}%`;
  barWise.style.width = `${(score.wise/30)*100}%`;

  // 读取对应年龄段文案，没有单独a/b/c字段就默认B青年版
  let txt;
  if(bestChar[selectedAge]){
    txt = bestChar[selectedAge];
  }else{
    txt = bestChar.b;
  }
  charAnalysis.innerText = txt.analysis;
  charGood.innerText = txt.good;
  charBad.innerText = txt.bad;
  charMate.innerText = txt.mate;

  sameBox.innerHTML = '';
  if(bestChar.same){
    bestChar.same.forEach(name=>{
      const span = document.createElement('span');
      span.className = 'same-tag';
      span.innerText = name;
      sameBox.appendChild(span);
    });
  }
}

restartBtn.addEventListener('click',()=>{
  curQ = 0;
  score = {free:0,will:0,gentle:0,wise:0};
  answerRecord = Array(questionList.length).fill(null);
  selectOpt = null;
  selectedAge = null;
  res.classList.remove('active');
  home.classList.add('active');
  document.querySelectorAll('.age-opt').forEach(d=>d.classList.remove('selected'));
  btnStart.disabled = true;
});
</script>
</body>
</html>
